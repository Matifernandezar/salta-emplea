name: Pruebas de Salta Emplea
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: salta_pruebas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: exclusiva-de-pruebas-ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Probar con PostgreSQL aislado
        env:
          POSTGRES_TEST_URL: postgresql://postgres:exclusiva-de-pruebas-ci@postgres:5432/salta_pruebas
        run: python -m pytest -q
